# Photoblog frontend — Netlify
# Base directory is set in the Netlify UI to "client" (do not also set base here
# or the build path becomes client/client and fails).
#
# UI settings:
#   Base directory:    client
#   Build command:     npm install && npm run build
#   Publish directory: dist

[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: client-side routes fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
